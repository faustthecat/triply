<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Triply</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input { padding: 8px; margin: 5px; }
    button { padding: 8px; margin: 5px; }
    li { margin: 4px 0; }
  </style>
</head>
<body>
  <h1>Triply 🚏</h1>

  <!-- Search -->
  <input id="search" placeholder="Search stop..." oninput="searchStop()" />
  <ul id="results"></ul>

  <hr/>

  <!-- Manual -->
  <input id="stopId" placeholder="Stop ID (např. U699Z1P)" />
  <button onclick="load()">Load</button>
  <button onclick="loadNearest()">Nearest stop</button>

  <h2>Departures</h2>
  <ul id="list"></ul>

  <script>
    async function load() {
      const stopId =
        document.getElementById("stopId").value || "U699Z1P";

      console.log("Loading stop:", stopId);

      const res = await fetch(`/api/departures?stopId=${stopId}`);
      const data = await res.json();

      console.log("API response:", data);

      const list = document.getElementById("list");
      list.innerHTML = "";

      const departures =
        data.departures ||
        data[0]?.departures ||
        data.data?.departures ||
        [];

      if (departures.length === 0) {
        list.innerHTML = "<li>No departures found</li>";
        return;
      }

      departures.forEach(d => {
        const li = document.createElement("li");

        const time = new Date(d.departure_timestamp.predicted);
        const formatted = time.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });

        li.textContent =
          `${d.route.short_name} → ${d.trip.headsign} (${formatted})`;

        list.appendChild(li);
      });
    }

    async function loadNearest() {
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        console.log("GPS:", lat, lon);

        const res = await fetch(`/api/stops?lat=${lat}&lon=${lon}`);
        const stops = await res.json();

        console.log("Stops:", stops);

        if (!stops.length) {
          alert("No stops found nearby");
          return;
        }

        const nearest = stops[0];
        document.getElementById("stopId").value = nearest.id;

        load();
      });
    }

    async function searchStop() {
      const q = document.getElementById("search").value;

      if (q.length < 2) return;

      const res = await fetch(`/api/search?name=${q}`);
      const data = await res.json();

      const results = document.getElementById("results");
      results.innerHTML = "";

      data.forEach(s => {
        const li = document.createElement("li");
        li.textContent = s.name;

        li.onclick = () => {
          document.getElementById("stopId").value = s.id;
          results.innerHTML = "";
          load();
        };

        results.appendChild(li);
      });
    }
  </script>
</body>
</html>
