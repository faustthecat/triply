<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Triply</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe6;
      --surface: #fffaf2;
      --surface-strong: #fff;
      --text: #1f2933;
      --muted: #52606d;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --border: #d9e2ec;
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
      --danger: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.18), transparent 28%),
        linear-gradient(180deg, #f9f5ee 0%, var(--bg) 100%);
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px;
      border: 1px solid rgba(217, 226, 236, 0.8);
      border-radius: 24px;
      background: rgba(255, 250, 242, 0.92);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .stack {
      display: grid;
      gap: 24px;
      margin-top: 28px;
    }

    .panel {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface-strong);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 1.15rem;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    label {
      font-weight: 600;
    }

    input,
    button {
      font: inherit;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
    }

    input:focus {
      outline: 2px solid rgba(15, 118, 110, 0.2);
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }

    button:hover {
      background: var(--accent-strong);
      transform: translateY(-1px);
    }

    button.secondary {
      background: #dcefe9;
      color: var(--accent-strong);
    }

    button.secondary:hover {
      background: #cbe7df;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .status {
      min-height: 24px;
      margin-top: 14px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    .current-stop {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 700;
    }

    ul {
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    li {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }

    li + li {
      margin-top: 10px;
    }

    .search-result {
      cursor: pointer;
    }

    .search-result:hover,
    .search-result:focus {
      border-color: var(--accent);
      outline: none;
    }

    .search-result-title {
      display: block;
      font-weight: 700;
      color: var(--text);
    }

    .search-result-subtitle {
      display: block;
      margin-top: 4px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .nearest-list {
      margin-top: 16px;
    }

    .nearest-item {
      cursor: pointer;
    }

    .nearest-item:hover,
    .nearest-item:focus {
      border-color: var(--accent);
      outline: none;
    }

    .nearest-distance {
      display: block;
      margin-top: 4px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .location-debug {
      margin-top: 14px;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .nearest-map {
      display: none;
      height: 320px;
      margin-top: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
    }

    .nearest-map.is-visible {
      display: block;
    }

    .nearest-map .leaflet-popup-content {
      margin: 10px 12px;
      color: var(--text);
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      main {
        padding: 20px;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Triply</h1>
    <p>Rychly prehled odjezdu z vybrane zastavky PID.</p>

    <div class="stack">
      <section class="panel" aria-labelledby="search-heading">
        <h2 id="search-heading">Najit zastavku</h2>
        <div class="field">
          <label for="search">Nazev zastavky</label>
          <input id="search" placeholder="Zacni psat nazev zastavky" autocomplete="on" />
        </div>
        <div id="searchStatus" class="status" aria-live="polite"></div>
        <ul id="results" aria-label="Vysledky hledani"></ul>
      </section>

      <section class="panel" aria-labelledby="departures-heading">
        <h2 id="departures-heading">Odjezdy</h2>
        <div class="field">
          <label for="stopId">ID zastavky</label>
          <input id="stopId" placeholder="Napr. U699Z1P" />
        </div>
        <div class="actions">
          <button id="loadButton" type="button">Nacist odjezdy</button>
          <button id="nearestButton" type="button" class="secondary">Nejblizsi zastavka</button>
        </div>
        <p id="locationDebug" class="location-debug muted">Souradnice zatim nejsou k dispozici.</p>
        <div id="nearestMap" class="nearest-map" aria-label="Mapa nejblizsich zastavek"></div>
        <ul id="nearestList" class="nearest-list" aria-label="Nejblizsi zastavky"></ul>
        <p id="currentStop" class="current-stop muted">Zatim neni vybrana zadna zastavka.</p>
        <div id="status" class="status" aria-live="polite"></div>
        <ul id="list" aria-label="Seznam odjezdu"></ul>
      </section>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const searchInput = document.getElementById("search");
    const stopIdInput = document.getElementById("stopId");
    const results = document.getElementById("results");
    const list = document.getElementById("list");
    const status = document.getElementById("status");
    const searchStatus = document.getElementById("searchStatus");
    const currentStop = document.getElementById("currentStop");
    const loadButton = document.getElementById("loadButton");
    const nearestButton = document.getElementById("nearestButton");
    const nearestList = document.getElementById("nearestList");
    const locationDebug = document.getElementById("locationDebug");
    const nearestMap = document.getElementById("nearestMap");

    let searchTimeout;
    let searchRequestId = 0;
    let map = null;
    let nearestMarkers = null;

    function toStopIds(stop) {
      if (Array.isArray(stop?.ids) && stop.ids.length) {
        return stop.ids.filter(Boolean);
      }

      if (typeof stop?.id === "string" && stop.id.trim()) {
        return [stop.id.trim()];
      }

      return [];
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.className = isError ? "status error" : "status";
    }

    function setSearchStatus(message, isError = false) {
      searchStatus.textContent = message;
      searchStatus.className = isError ? "status error" : "status";
    }

    function setLoadingState(button, isLoading) {
      button.disabled = isLoading;
    }

    function formatDistance(distance) {
      if (!Number.isFinite(distance)) {
        return "";
      }

      if (distance < 1000) {
        return distance + " m";
      }

      return (distance / 1000).toFixed(1) + " km";
    }

    function formatCoordinate(value) {
      if (!Number.isFinite(value)) {
        return "";
      }

      return value.toFixed(6);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function clearNearestStops() {
      nearestList.innerHTML = "";
    }

    function renderLocationDebug(lat, lon, accuracy) {
      const accuracyText = Number.isFinite(accuracy)
        ? ", presnost " + Math.round(accuracy) + " m"
        : "";

      locationDebug.textContent =
        "Tvoje souradnice: lat " +
        formatCoordinate(lat) +
        ", lon " +
        formatCoordinate(lon) +
        accuracyText;
      locationDebug.classList.remove("muted");
    }

    function ensureNearestMap() {
      if (!window.L) {
        nearestMap.classList.remove("is-visible");
        return null;
      }

      nearestMap.classList.add("is-visible");

      if (!map) {
        map = L.map(nearestMap, {
          scrollWheelZoom: false
        });

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap"
        }).addTo(map);
      }

      if (nearestMarkers) {
        nearestMarkers.clearLayers();
      } else {
        nearestMarkers = L.layerGroup().addTo(map);
      }

      return map;
    }

    function renderNearestMap(lat, lon, stops) {
      const activeMap = ensureNearestMap();

      if (!activeMap) {
        locationDebug.textContent += " | Mapa se nepodarila nacist.";
        return;
      }

      const bounds = L.latLngBounds();
      const userPosition = L.latLng(lat, lon);
      bounds.extend(userPosition);

      L.circleMarker(userPosition, {
        radius: 8,
        color: "#0f766e",
        fillColor: "#0f766e",
        fillOpacity: 0.9,
        weight: 2
      })
        .bindPopup("Tvoje poloha")
        .addTo(nearestMarkers);

      stops.forEach((stop) => {
        if (!Number.isFinite(stop.lat) || !Number.isFinite(stop.lon)) {
          return;
        }

        const stopPosition = L.latLng(stop.lat, stop.lon);
        bounds.extend(stopPosition);

        L.marker(stopPosition)
          .bindPopup(
            "<strong>" +
              escapeHtml(stop.name || stop.fullName || stop.id || "Neznama zastavka") +
              "</strong><br>" +
              formatDistance(stop.distance) +
              "<br>lat " +
              formatCoordinate(stop.lat) +
              ", lon " +
              formatCoordinate(stop.lon)
          )
          .addTo(nearestMarkers);
      });

      setTimeout(() => {
        activeMap.invalidateSize();

        if (bounds.isValid()) {
          activeMap.fitBounds(bounds, {
            padding: [28, 28],
            maxZoom: 17
          });
        }
      }, 0);
    }

    function applySelectedStop(stop, shouldLoad = true) {
      const stopIds = toStopIds(stop);
      stopIdInput.value = stopIds.join(",");
      currentStop.dataset.stopIds = stopIds.join(",");
      currentStop.dataset.label = stop.fullName || stop.name || stop.id || "";
      currentStop.textContent = "Zastavka: " + (currentStop.dataset.label || "neznama");
      currentStop.classList.remove("muted");
      clearNearestStops();

      if (shouldLoad) {
        load();
      }
    }

    function renderNearestStops(stops) {
      clearNearestStops();

      stops.forEach((stop) => {
        const li = document.createElement("li");
        li.className = "nearest-item";
        li.tabIndex = 0;

        const title = document.createElement("span");
        title.className = "search-result-title";
        title.textContent = stop.name || stop.id || "Neznama zastavka";

        const subtitle = document.createElement("span");
        subtitle.className = "search-result-subtitle";
        subtitle.textContent = stop.subtitle || (stop.fullName && stop.fullName !== stop.name ? stop.fullName : "");

        const distance = document.createElement("span");
        distance.className = "nearest-distance";
        distance.textContent = formatDistance(stop.distance);

        li.appendChild(title);
        if (subtitle.textContent) {
          li.appendChild(subtitle);
        }
        if (distance.textContent) {
          li.appendChild(distance);
        }

        const handleSelect = () => {
          setStatus("Nacitam odjezdy pro vybranou zastavku...");
          applySelectedStop(stop, true);
        };

        li.addEventListener("click", handleSelect);
        li.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            handleSelect();
          }
        });

        nearestList.appendChild(li);
      });
    }

    function getDepartureTimestamp(departure) {
      return (
        departure.departure_timestamp?.predicted ||
        departure.departure_timestamp?.scheduled ||
        departure.arrival_timestamp?.predicted ||
        departure.arrival_timestamp?.scheduled ||
        null
      );
    }

    function getDepartureDelayLabel(departure) {
      const predicted =
        departure.departure_timestamp?.predicted ||
        departure.arrival_timestamp?.predicted;
      const scheduled =
        departure.departure_timestamp?.scheduled ||
        departure.arrival_timestamp?.scheduled;

      if (!predicted || !scheduled) {
        return "";
      }

      const predictedTime = new Date(predicted).getTime();
      const scheduledTime = new Date(scheduled).getTime();

      if (Number.isNaN(predictedTime) || Number.isNaN(scheduledTime)) {
        return "";
      }

      const delayMinutes = Math.round((predictedTime - scheduledTime) / 60000);

      if (delayMinutes === 0) {
        return "vcas";
      }

      if (delayMinutes > 0) {
        return "+" + delayMinutes + " min";
      }

      return delayMinutes + " min";
    }

    function toBooleanFlag(value) {
      if (typeof value === "boolean") {
        return value;
      }

      if (typeof value === "number") {
        return value > 0;
      }

      if (typeof value === "string") {
        const normalized = value.trim().toLowerCase();
        return ["1", "true", "yes", "ano", "available"].includes(normalized);
      }

      return false;
    }

    function getVehicleTypeEmoji(departure) {
      const numericTypes = [
        departure.route?.type,
        departure.route?.gtfs_route_type,
        departure.route?.route_type,
        departure.route?.vehicle_type_id,
        departure.trip?.vehicle_type_id
      ]
        .map((value) => Number(value))
        .filter((value) => Number.isFinite(value));

      if (numericTypes.some((value) => value === 1 || value === 400 || value === 401)) {
        return "🚇";
      }

      if (numericTypes.some((value) => value === 0 || value === 900)) {
        return "🚋";
      }

      if (numericTypes.some((value) => value === 11 || value === 800)) {
        return "🚎";
      }

      if (numericTypes.some((value) => value === 3 || value === 700)) {
        return "🚌";
      }

      const textFields = [
        departure.route?.type,
        departure.route?.vehicle_type,
        departure.route?.vehicle_type_description,
        departure.route?.vehicle_type_name,
        departure.route?.transport_type,
        departure.trip?.vehicle_type,
        departure.vehicle_type,
        departure.vehicle_type?.description_cs,
        departure.vehicle_type?.description_en
      ]
        .filter(Boolean)
        .map((value) => String(value).toLowerCase());

      if (textFields.some((value) => value.includes("metro") || value.includes("subway"))) {
        return "🚇";
      }

      if (textFields.some((value) => value.includes("trolley") || value.includes("trolej"))) {
        return "🚎";
      }

      if (textFields.some((value) => value.includes("tram"))) {
        return "🚋";
      }

      if (textFields.some((value) => value.includes("bus"))) {
        return "🚌";
      }

      return "🚍";
    }

    function getDepartureFeatures(departure, vehicleEmoji) {
      if (vehicleEmoji !== "🚋") {
        return "";
      }

      const lowFloor = [
        departure.trip?.is_wheelchair_accessible,
        departure.trip?.wheelchair_accessible,
        departure.trip?.wheelchair_accessibility,
        departure.trip?.is_low_floor,
        departure.trip?.low_floor,
        departure.trip?.lowFloor,
        departure.vehicle?.is_wheelchair_accessible,
        departure.vehicle?.is_low_floor,
        departure.is_wheelchair_accessible,
        departure.is_low_floor
      ].some(toBooleanFlag);

      const airConditioned = [
        departure.trip?.is_air_conditioned,
        departure.trip?.air_conditioned,
        departure.trip?.airConditioned,
        departure.vehicle?.is_air_conditioned,
        departure.vehicle?.air_conditioned,
        departure.vehicle?.airConditioned,
        departure.is_air_conditioned
      ].some(toBooleanFlag);

      return (lowFloor ? " ♿" : "") + (airConditioned ? " ❄️" : "");
    }

    function getDepartureDirection(departure) {
      return (
        departure.trip?.headsign ||
        departure.stop?.platform_name ||
        departure.stop?.name ||
        "Bez cilove stanice"
      );
    }

    function normalizeDeparturesResponse(payload) {
      if (Array.isArray(payload)) {
        return payload.flatMap((item) => normalizeDeparturesResponse(item));
      }

      if (Array.isArray(payload?.departures)) {
        return payload.departures;
      }

      if (Array.isArray(payload?.data?.departures)) {
        return payload.data.departures;
      }

      if (Array.isArray(payload?.stops)) {
        return payload.stops.flatMap((item) => normalizeDeparturesResponse(item));
      }

      if (Array.isArray(payload?.data)) {
        return payload.data.flatMap((item) => normalizeDeparturesResponse(item));
      }

      return [];
    }

    function renderDepartures(departures) {
      list.innerHTML = "";

      if (!departures.length) {
        const li = document.createElement("li");
        li.textContent = "Nebyly nalezeny zadne odjezdy.";
        list.appendChild(li);
        return;
      }

      departures.forEach((departure) => {
        const li = document.createElement("li");
        const timestamp = getDepartureTimestamp(departure);
        const route = departure.route?.short_name || "Spoj";
        const headsign = getDepartureDirection(departure);
        const vehicleEmoji = getVehicleTypeEmoji(departure);
        const featureIcons = getDepartureFeatures(departure, vehicleEmoji);
        const delayLabel = getDepartureDelayLabel(departure);

        let formatted = "cas neni k dispozici";
        if (timestamp) {
          const time = new Date(timestamp);
          if (!Number.isNaN(time.getTime())) {
            formatted = time.toLocaleTimeString("cs-CZ", {
              hour: "2-digit",
              minute: "2-digit"
            });
          }
        }

        li.textContent =
          vehicleEmoji +
          " " +
          route +
          featureIcons +
          " -> " +
          headsign +
          " (" +
          formatted +
          (delayLabel ? ", " + delayLabel : "") +
          ")";
        list.appendChild(li);
      });
    }

    async function fetchJsonOrThrow(url, fallbackMessage) {
      const res = await fetch(url);
      let payload = null;

      try {
        payload = await res.json();
      } catch (error) {
        payload = null;
      }

      if (!res.ok) {
        const message =
          payload?.details ||
          payload?.error ||
          payload?.message ||
          fallbackMessage;
        throw new Error(message);
      }

      return payload;
    }

    async function load() {
      const stopId = stopIdInput.value.trim();

      if (!stopId) {
        setStatus("Nejdriv vyber zastavku nebo zadej jeji ID.", true);
        list.innerHTML = "";
        return;
      }

      clearNearestStops();
      const knownStopIds = currentStop.dataset.stopIds || "";
      const currentLabel =
        knownStopIds === stopId
          ? currentStop.dataset.label || stopId
          : stopId;
      currentStop.dataset.stopIds = stopId;
      currentStop.dataset.label = currentLabel;
      currentStop.textContent = "Zastavka: " + currentLabel;
      currentStop.classList.remove("muted");
      setStatus("Nacitam odjezdy...");
      setLoadingState(loadButton, true);

      try {
        const data = await fetchJsonOrThrow(
          "/api/departures?stopId=" + encodeURIComponent(stopId),
          "Nepodarilo se nacist odjezdy."
        );
        const departures = normalizeDeparturesResponse(data).sort((a, b) => {
          const first = getDepartureTimestamp(a);
          const second = getDepartureTimestamp(b);
          const firstTime = first ? new Date(first).getTime() : Number.POSITIVE_INFINITY;
          const secondTime = second ? new Date(second).getTime() : Number.POSITIVE_INFINITY;
          return firstTime - secondTime;
        });

        renderDepartures(departures);
        setStatus("Nacteno " + departures.length + " odjezdu.");
      } catch (error) {
        console.error("LOAD ERROR:", error);
        list.innerHTML = "";
        setStatus(error.message || "Nacitani odjezdu selhalo.", true);
      } finally {
        setLoadingState(loadButton, false);
      }
    }

    async function loadNearest() {
      if (!navigator.geolocation) {
        setStatus("Tento prohlizec nepodporuje geolokaci.", true);
        return;
      }

      clearNearestStops();
      setStatus("Zjistuji nejblizsi zastavku...");
      setLoadingState(nearestButton, true);

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          try {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;
            renderLocationDebug(lat, lon, accuracy);
            const stops = await fetchJsonOrThrow(
              "/api/stops?lat=" + encodeURIComponent(lat) + "&lon=" + encodeURIComponent(lon) + "&limit=10",
              "Nepodarilo se nacist okoli zastavky."
            );

            if (!Array.isArray(stops) || !stops.length) {
              setStatus("V okoli nebyly nalezeny zadne zastavky.", true);
              return;
            }

            renderNearestStops(stops);
            renderNearestMap(lat, lon, stops);
            setStatus("Vyber jednu z nejblizsich zastavek.");
          } catch (error) {
            console.error("NEAREST ERROR:", error);
            setStatus(error.message || "Nacitani nejblizsi zastavky selhalo.", true);
          } finally {
            setLoadingState(nearestButton, false);
          }
        },
        (error) => {
          console.error("GEOLOCATION ERROR:", error);
          setLoadingState(nearestButton, false);
          setStatus("Pristup k poloze nebyl povolen nebo se ji nepodarilo ziskat.", true);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function renderSearchResults(stops) {
      results.innerHTML = "";

      if (!stops.length) {
        setSearchStatus("Zadne zastavky neodpovidaji hledani.");
        return;
      }

      setSearchStatus("Vyber zastavku ze seznamu.");

      stops.forEach((stop) => {
        const li = document.createElement("li");
        li.className = "search-result";
        li.tabIndex = 0;
        const title = document.createElement("span");
        title.className = "search-result-title";
        title.textContent = stop.name || stop.fullName || stop.id || "Neznama zastavka";

        const subtitle = document.createElement("span");
        subtitle.className = "search-result-subtitle";
        subtitle.textContent = stop.subtitle || (stop.fullName && stop.fullName !== stop.name ? stop.fullName : stop.id || "");

        li.appendChild(title);
        if (subtitle.textContent) {
          li.appendChild(subtitle);
        }

        const handleSelect = () => {
          applySelectedStop(stop, true);
          results.innerHTML = "";
          setSearchStatus("");
        };

        li.addEventListener("click", handleSelect);
        li.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            handleSelect();
          }
        });

        results.appendChild(li);
      });
    }

    async function searchStop() {
      const query = searchInput.value.trim();
      const requestId = searchRequestId + 1;
      searchRequestId = requestId;

      if (query.length < 2) {
        results.innerHTML = "";
        setSearchStatus(query.length === 0 ? "" : "Zadej alespon 2 znaky.");
        return;
      }

      setSearchStatus("Hledam zastavky...");

      try {
        const data = await fetchJsonOrThrow(
          "/api/search?name=" + encodeURIComponent(query),
          "Vyhledavani zastavek selhalo."
        );

        if (requestId !== searchRequestId || query !== searchInput.value.trim()) {
          return;
        }

        renderSearchResults(Array.isArray(data) ? data : []);
      } catch (error) {
        if (requestId !== searchRequestId || query !== searchInput.value.trim()) {
          return;
        }

        console.error("SEARCH ERROR:", error);
        results.innerHTML = "";
        setSearchStatus(error.message || "Vyhledavani selhalo.", true);
      }
    }

    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(searchStop, 250);
    });

    stopIdInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        load();
      }
    });

    loadButton.addEventListener("click", load);
    nearestButton.addEventListener("click", loadNearest);
  </script>
</body>
</html>
